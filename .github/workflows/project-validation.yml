name: Project Validation

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "sdk/**"
      - "config/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/project-validation.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "sdk/**"
      - "config/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/project-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure and scripts
        shell: pwsh
        run: ./scripts/Validate-Repository.ps1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test read-only game evidence collection
        shell: pwsh
        run: ./scripts/Test-GameEvidence.ps1 -TestBootstrap

      - name: Test Windows PowerShell 5.1 evidence command
        shell: powershell
        run: ./scripts/Test-GameEvidence.ps1 -TestBootstrap

      - name: Verify real UE4.22 legacy evidence exporter
        shell: powershell
        run: ./scripts/Test-LegacyGameEvidence.ps1

      - name: Verify reversible reflection probe in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test-FavoritesReflectionProbe.ps1

      - name: Build cooked-asset inspection tool
        shell: pwsh
        run: dotnet build tools/UAssetProbe/UAssetProbe.csproj -c Release

      - name: Test legacy read-only native reader without game assets
        shell: pwsh
        run: |
          dotnet run --project tools/LegacyNativeEvidence/LegacyNativeEvidence.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native reader fixture tests failed." }

      - name: Test bounded native code decoder without game assets
        shell: pwsh
        run: |
          dotnet run --project tools/LegacyNativeCodeEvidence/LegacyNativeCodeEvidence.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native code evidence fixture tests failed." }

      - name: Test save and favorites journal contracts without private saves
        shell: pwsh
        run: |
          dotnet run --project tools/FavoritesPersistenceCore/FavoritesPersistenceCore.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "Favorites persistence contract tests failed." }

      - name: Build cooked runtime tools
        shell: pwsh
        run: |
          foreach ($tool in @("CookedQoLPatcher", "CookedAssetRelocator", "CookedSaveGameSynth", "CookedGraphTests", "CookedLoadProbe", "CookedInventoryProbe", "CookedInventoryFeatures")) {
            dotnet build "tools/$tool/$tool.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$tool build failed." }
          }

      - name: Confirm third-party reference notice
        shell: pwsh
        run: |
          if (-not (Test-Path "third_party/camera-coordinates-overlay/NOTICE.md")) {
            throw "Third-party reference assets exist without their NOTICE.md."
          }
          Write-Host "[OK] Third-party reference notice present."
