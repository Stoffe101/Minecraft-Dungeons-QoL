name: Research Blueprint Template

on:
  workflow_dispatch:
  push:
    paths:
      - "ci-trigger/decompile-template.txt"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Checkout KismetKompiler
        shell: pwsh
        run: |
          git clone --recursive https://github.com/tge-was-taken/KismetKompiler.git .tools/KismetKompiler

      - name: Checkout MIT Dungeons template
        shell: pwsh
        run: |
          git clone https://github.com/StainlessStasis/LetMeMove.git .research/LetMeMove
          git -C .research/LetMeMove checkout 49ac4067ab13d1aeebfad362a892a49d98c0b3dd

      - name: Build KismetKompiler
        shell: pwsh
        run: |
          dotnet build .tools/KismetKompiler/src/KismetKompiler/KismetKompiler.csproj -c Release

      - name: Probe UE version compatibility
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force research/decompiled | Out-Null
          $asset = ".research/LetMeMove/Content/Mods/LetMeMove/BP_WASD_Movement.uasset"
          $versions = @("4.15","4.16","4.17","4.18","4.19","4.20","4.21","4.22","4.23","4.24","4.25","4.26","4.27")
          $report = @()
          $success = $false

          foreach ($version in $versions) {
            $safeVersion = $version.Replace(".", "_")
            $out = "research/decompiled/BP_WASD_Movement_UE${safeVersion}.kms"
            Write-Host "Trying UE $version"
            $log = & dotnet run --project .tools/KismetKompiler/src/KismetKompiler/KismetKompiler.csproj -c Release --no-build -- decompile -v $version -i $asset -o $out --no-verify -f 2>&1
            $exitCode = $LASTEXITCODE
            $report += "## UE $version"
            $report += ""
            $report += "Exit code: $exitCode"
            $report += ""
            if ($log) {
              $report += ($log | Select-Object -Last 20 | ForEach-Object { "    $_" })
            }
            $report += ""

            if ($exitCode -eq 0 -and (Test-Path $out)) {
              Write-Host "SUCCESS with UE $version"
              Copy-Item $out "research/decompiled/BP_WASD_Movement.kms" -Force
              $report += "**SUCCESS**"
              $report += ""
              $success = $true
              break
            }
          }

          $report | Set-Content "research/decompiled/COMPATIBILITY_REPORT.md"
          if (-not $success) {
            Write-Warning "No tested UE version successfully parsed the template. Committing the report for the next research step."
          }

      - name: Save research result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/decompiled
          if (-not (git diff --cached --quiet)) {
            git commit -m "research: probe Dungeons Blueprint asset compatibility"
            git push
          }
