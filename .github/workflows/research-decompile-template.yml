name: Research Blueprint Template

on:
  workflow_dispatch:
  push:
    paths:
      - "ci-trigger/decompile-template.txt"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Checkout KismetKompiler
        shell: pwsh
        run: |
          git clone --recursive https://github.com/tge-was-taken/KismetKompiler.git .tools/KismetKompiler
          git -C .tools/KismetKompiler checkout 8fbb843db1da73f96fae1c10ef36752872feab73

      - name: Replace old UAssetAPI submodule with working NuGet package
        shell: pwsh
        run: |
          $projects = @(
            ".tools/KismetKompiler/src/KismetKompiler/KismetKompiler.csproj",
            ".tools/KismetKompiler/src/KismetKompiler.Library/KismetKompiler.Library.csproj"
          )

          foreach ($project in $projects) {
            [xml]$xml = Get-Content $project

            $projectRefs = @($xml.Project.ItemGroup.ProjectReference)
            foreach ($ref in $projectRefs) {
              if ($ref.Include -like "*UAssetAPI*") {
                [void]$ref.ParentNode.RemoveChild($ref)
              }
            }

            $itemGroup = $xml.CreateElement("ItemGroup")
            $packageRef = $xml.CreateElement("PackageReference")
            $packageRef.SetAttribute("Include", "UAssetAPI")
            $packageRef.SetAttribute("Version", "1.1.0")
            [void]$itemGroup.AppendChild($packageRef)
            [void]$xml.Project.AppendChild($itemGroup)

            $settings = New-Object System.Xml.XmlWriterSettings
            $settings.Indent = $true
            $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
            $writer = [System.Xml.XmlWriter]::Create((Resolve-Path $project), $settings)
            $xml.Save($writer)
            $writer.Close()
          }

      - name: Checkout MIT Dungeons template
        shell: pwsh
        run: |
          git clone https://github.com/StainlessStasis/LetMeMove.git .research/LetMeMove
          git -C .research/LetMeMove checkout 49ac4067ab13d1aeebfad362a892a49d98c0b3dd

      - name: Build patched KismetKompiler
        shell: pwsh
        run: |
          dotnet build .tools/KismetKompiler/src/KismetKompiler/KismetKompiler.csproj -c Release

      - name: Decompile Dungeons 1 actor template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force research/decompiled | Out-Null
          dotnet run --project .tools/KismetKompiler/src/KismetKompiler/KismetKompiler.csproj -c Release --no-build -- decompile -v 4.22 -i ".research/LetMeMove/Content/Mods/LetMeMove/BP_WASD_Movement.uasset" -o "research/decompiled/BP_WASD_Movement.kms" --no-verify -f
          if (-not (Test-Path "research/decompiled/BP_WASD_Movement.kms")) {
            throw "KismetKompiler did not produce the expected KMS file."
          }

      - name: Save research result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/decompiled/BP_WASD_Movement.kms
          if (-not (git diff --cached --quiet)) {
            git commit -m "research: decompile Dungeons Blueprint template with UAssetAPI 1.1.0"
            git push
          }
