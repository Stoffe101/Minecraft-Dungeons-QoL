name: Cooked Blueprint Roundtrip Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ci-trigger/cooked-roundtrip.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch build tools and known-good cooked shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .research/cooked-roundtrip | Out-Null
          Invoke-WebRequest -Uri "https://github.com/StainlessStasis/LetMeMove/releases/download/1.1.0/LetMeMove.zip" -OutFile ".research/cooked-roundtrip/LetMeMove.zip"
          Expand-Archive ".research/cooked-roundtrip/LetMeMove.zip" ".research/cooked-roundtrip/zip" -Force

          git clone --depth 1 https://github.com/Dokucraft/Dungeons-Mod-Kit.git .tools/Dungeons-Mod-Kit

          $pak = Get-ChildItem ".research/cooked-roundtrip/zip" -Recurse -Filter "*.pak" | Select-Object -First 1
          if (-not $pak) { throw "LetMeMove release did not contain a pak." }

          New-Item -ItemType Directory -Force ".research/cooked-roundtrip/unpacked" | Out-Null
          python ".tools/Dungeons-Mod-Kit/Tools/py/u4pak.py" unpack -C ".research/cooked-roundtrip/unpacked" $pak.FullName

      - name: Patch and re-open cooked actor
        shell: pwsh
        run: |
          $actor = Get-ChildItem ".research/cooked-roundtrip/unpacked" -Recurse -Filter "BP_WASD_Movement.uasset" | Select-Object -First 1
          if (-not $actor) { throw "Cooked actor not found." }

          $patchedDir = ".research/cooked-roundtrip/patched"
          New-Item -ItemType Directory -Force $patchedDir | Out-Null
          $patched = Join-Path $patchedDir "BP_WASD_Movement.uasset"

          dotnet run --project tools/CookedActorPatcher/CookedActorPatcher.csproj -- $actor.FullName $patched roundtrip

          if (-not (Test-Path $patched)) { throw "Patched uasset not produced." }
          $patchedUexp = [System.IO.Path]::ChangeExtension($patched, ".uexp")
          if (-not (Test-Path $patchedUexp)) { throw "Patched uexp not produced." }

          Copy-Item $patched $actor.FullName -Force
          Copy-Item $patchedUexp ([System.IO.Path]::ChangeExtension($actor.FullName, ".uexp")) -Force

          dotnet run --project tools/UAssetProbe/UAssetProbe.csproj -- $actor.FullName | Out-File ".research/cooked-roundtrip/ROUNDTRIP_ASSET_REPORT.txt"

      - name: Repack test mod
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/dev" | Out-Null
          Push-Location ".research/cooked-roundtrip/unpacked"
          try {
            python "$env:GITHUB_WORKSPACE/.tools/Dungeons-Mod-Kit/Tools/py/u4pak.py" pack "$env:GITHUB_WORKSPACE/dist/dev/MinecraftDungeonsQoL-Roundtrip.pak" Dungeons -p
          } finally {
            Pop-Location
          }

          if (-not (Test-Path "dist/dev/MinecraftDungeonsQoL-Roundtrip.pak")) {
            throw "Roundtrip pak was not produced."
          }

          python ".tools/Dungeons-Mod-Kit/Tools/py/u4pak.py" list "dist/dev/MinecraftDungeonsQoL-Roundtrip.pak" | Out-File ".research/cooked-roundtrip/PAK_LIST.txt"

          $hash = (Get-FileHash "dist/dev/MinecraftDungeonsQoL-Roundtrip.pak" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "# Cooked Blueprint roundtrip build"
            ""
            "Source shell: StainlessStasis/LetMeMove 1.1.0 (MIT)"
            "Transformation: W/S/A/D key constants -> F6/F7/F8/F9"
            "Purpose: prove UAssetAPI cooked write + re-open + pak repack pipeline"
            "SHA-256: $hash"
            ""
            "This is a development pipeline proof, not the QoL feature build."
          ) | Set-Content "dist/dev/ROUNDTRIP_BUILD.md"

      - name: Commit roundtrip artifact
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/dev/MinecraftDungeonsQoL-Roundtrip.pak dist/dev/ROUNDTRIP_BUILD.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: produce validated cooked Blueprint roundtrip pak"
            git pull --rebase origin main
            git push
          }
