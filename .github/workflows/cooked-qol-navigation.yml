name: Cooked QoL Diagnostic Build

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/CookedQoLPatcher/**"
      - "tools/CookedAssetRelocator/**"
      - "tools/CookedSaveGameSynth/**"
      - "tools/CookedGraphTests/**"
      - "tools/CookedLoadProbe/**"
      - "scripts/Build-Diagnostic.ps1"
      - "config/cooked-template.json"
      - "ci-trigger/qol-navigation.txt"
      - ".github/workflows/cooked-qol-navigation.yml"
  pull_request:
    paths:
      - "tools/**"
      - "scripts/Build-Diagnostic.ps1"
      - "config/cooked-template.json"
      - ".github/workflows/cooked-qol-navigation.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate non-destructive diagnostic pak
        shell: pwsh
        run: ./scripts/Build-Diagnostic.ps1
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftDungeonsQoL-diagnostic
          path: dist/diagnostic/*
          if-no-files-found: error

      - name: Upload loading isolation probe
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftDungeonsQoL-load-probe
          path: dist/load-probe/*
          if-no-files-found: error
