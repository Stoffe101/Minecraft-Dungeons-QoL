name: Research UAssetAPI Compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - "ci-trigger/uasset-probe.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Checkout MIT Dungeons actor reference
        shell: pwsh
        run: |
          git clone https://github.com/StainlessStasis/LetMeMove.git .research/LetMeMove
          git -C .research/LetMeMove checkout 49ac4067ab13d1aeebfad362a892a49d98c0b3dd

      - name: Inspect working Dungeons assets with UAssetAPI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force research/uassetapi | Out-Null

          $assets = @(
            @{
              Name = "LetMeMove_Actor"
              Path = ".research/LetMeMove/Content/Mods/LetMeMove/BP_WASD_Movement.uasset"
            },
            @{
              Name = "CameraCoords_WidgetAdder"
              Path = "third_party/camera-coordinates-overlay/Content/Mods/CameraCoords/WidgetAdder.uasset"
            },
            @{
              Name = "CameraCoords_Widget"
              Path = "third_party/camera-coordinates-overlay/Content/Mods/CameraCoords/CameraCoordsOverlay.uasset"
            },
            @{
              Name = "CameraCoords_LoaderMap"
              Path = "third_party/camera-coordinates-overlay/Content/BPLoader/Menu/CameraCoords.umap"
            }
          )

          foreach ($asset in $assets) {
            Write-Host "Inspecting $($asset.Name)"
            $output = & dotnet run --project tools/UAssetProbe/UAssetProbe.csproj -- $asset.Path 2>&1
            $code = $LASTEXITCODE
            @(
              "# $($asset.Name)"
              ""
              "Source: $($asset.Path)"
              "Exit code: $code"
              ""
              $output
            ) | Set-Content "research/uassetapi/$($asset.Name).txt"
            Write-Host ($output | Out-String)
          }

          exit 0

      - name: Save probe reports
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/uassetapi
          if (-not (git diff --cached --quiet)) {
            git commit -m "research: inspect working Dungeons actor and UMG templates"
            git push
          }
