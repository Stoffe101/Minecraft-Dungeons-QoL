name: Research Kismet UAssetAPI Bisect

on:
  workflow_dispatch:
  push:
    paths:
      - "ci-trigger/kismet-bisect.txt"

permissions:
  contents: write

jobs:
  bisect:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Checkout KismetKompiler and Dungeons template
        shell: pwsh
        run: |
          git clone --recursive https://github.com/tge-was-taken/KismetKompiler.git .tools/KismetKompiler
          git -C .tools/KismetKompiler checkout 8fbb843db1da73f96fae1c10ef36752872feab73

          git clone https://github.com/StainlessStasis/LetMeMove.git .research/LetMeMove
          git -C .research/LetMeMove checkout 49ac4067ab13d1aeebfad362a892a49d98c0b3dd

      - name: Probe candidate UAssetAPI commits
        shell: pwsh
        run: |
          $candidates = @(
            "8fb576d586a0cff98ca741ac182bcd6df186903f",
            "8269993fd4b682d5137317668e7b899361584146",
            "5747218e77ec5fb15264848e831199c9ac49333f",
            "19a63a0b6144f4082549ab123cba67b9e484e1c7",
            "244bf99631acc95791fd2e16aa7df185df5000e3"
          )

          $sub = ".tools/KismetKompiler/external/UAssetAPI"
          $project = ".tools/KismetKompiler/src/KismetKompiler/KismetKompiler.csproj"
          $asset = ".research/LetMeMove/Content/Mods/LetMeMove/BP_WASD_Movement.uasset"
          New-Item -ItemType Directory -Force research/kismet-bisect | Out-Null
          $report = @("# KismetKompiler / UAssetAPI compatibility bisect", "")
          $winner = $null

          git -C $sub remote add upstream https://github.com/atenfyr/UAssetAPI.git 2>$null
          git -C $sub fetch upstream --tags
          foreach ($candidate in $candidates) { git -C $sub fetch upstream $candidate }

          foreach ($sha in $candidates) {
            Write-Host "=== Candidate $sha ==="
            git -C $sub checkout --force $sha
            if ($LASTEXITCODE -ne 0) {
              $report += "## $sha"
              $report += "Checkout failed."
              $report += ""
              continue
            }

            dotnet clean $project -c Release | Out-Null
            $build = & dotnet build $project -c Release --no-incremental 2>&1
            $buildCode = $LASTEXITCODE

            $report += "## $sha"
            $report += ""
            $report += "Build exit code: $buildCode"

            if ($buildCode -ne 0) {
              $report += ""
              $report += "Build tail:"
              $report += ($build | Select-Object -Last 15 | ForEach-Object { "    $_" })
              $report += ""
              continue
            }

            $out = "research/kismet-bisect/$sha.kms"
            $decompile = & dotnet run --project $project -c Release --no-build -- decompile -v 4.22 -i $asset -o $out --no-verify -f 2>&1
            $decompileCode = $LASTEXITCODE
            $report += "Decompile exit code: $decompileCode"

            if ($decompileCode -eq 0 -and (Test-Path $out)) {
              $report += ""
              $report += "**WINNER**"
              $report += ""
              $winner = $sha
              Copy-Item $out "research/kismet-bisect/BP_WASD_Movement.kms" -Force
              break
            } else {
              $report += ""
              $report += "Decompile tail:"
              $report += ($decompile | Select-Object -Last 15 | ForEach-Object { "    $_" })
              $report += ""
            }
          }

          if ($winner) {
            $report += "Selected commit: $winner"
            Set-Content "research/kismet-bisect/WINNER.txt" $winner
          } else {
            $report += "No candidate succeeded."
          }

          $report | Set-Content "research/kismet-bisect/REPORT.md"

      - name: Save bisect result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/kismet-bisect
          if (-not (git diff --cached --quiet)) {
            git commit -m "research: record Kismet UAssetAPI bisect"
            git push
          }
